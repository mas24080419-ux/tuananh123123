<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesHub | Thực đơn QR</title><link rel="stylesheet" href="/style.css"></head><body><div class="guest-head"><div class="wrap"><div style="font-weight:800;color:#a9e4d5;letter-spacing:3px">SALESHUB QR</div><h1>Chào mừng quý khách!</h1><p id="table">Đang mở thực đơn...</p></div></div><main class="wrap guest-main"><div id="storageNotice" class="banner" role="status">Đang mở kết nối nhận đơn...</div><div class="card"><h2>Thực đơn hôm nay</h2><p class="muted">Chọn món và số lượng, gửi đến bếp/bar.</p></div><div id="list"></div><div class="card"><h3>Ghi chú chung</h3><textarea id="note" maxlength="160" class="note" rows="2" placeholder="Ít đá, làm cay nhẹ..."></textarea></div><div id="sent" class="card hidden" style="margin-top:12px;color:#138466"><h2>✓ Đã gửi yêu cầu</h2><p id="receipt"></p><p id="deliveryState" aria-live="polite" class="muted">Đang xác minh máy chủ...</p></div></main><div class="fixed"><div class="wrap between"><div><b id="count">0 món</b><div class="price" id="total">0đ</div></div><button class="btn" id="submit" disabled>Gửi món đến bếp →</button></div></div><script>
var products=[],cart={},pending=crypto.randomUUID(),token=location.pathname.split('/').pop(),sending=false,lastOrderId=null;function el(x){return document.getElementById(x)};function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(x){return Number(x).toLocaleString('vi-VN')+'đ'}async function api(url,opts){var o=opts||{},r=await fetch(url,{method:o.method||'GET',headers:{'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined}),j=await r.json();if(!r.ok)throw Error(j.error||'Mất kết nối');return j}
function draw(){el('list').innerHTML=products.map(function(p){return '<div class="menu-item"><div><b>'+esc(p.name)+'</b><p class="muted">'+(p.station==='bar'?'Đồ uống · Bar':'Món ăn · Bếp')+'</p><div class="price">'+money(p.price)+'</div></div><div class="step"><button data-id="'+p.id+'" data-d="-1">−</button><b>'+(cart[p.id]||0)+'</b><button data-id="'+p.id+'" data-d="1">+</button></div></div>'}).join('');document.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){var id=b.dataset.id;cart[id]=Math.min(20,Math.max(0,(cart[id]||0)+Number(b.dataset.d)));draw()}});var n=0,sum=0;products.forEach(function(p){n+=cart[p.id]||0;sum+=(cart[p.id]||0)*p.price});el('count').textContent=n+' món';el('total').textContent=money(sum);el('submit').disabled=!n||sending}
api('/api/menu/'+token).then(function(d){el('storageNotice').textContent=d.mode==='postgres'?'Đơn hàng được lưu trên PostgreSQL. Vui lòng thanh toán với nhân viên.':'THỬ NGHIỆM: Đơn lưu tạm và có thể mất khi máy chủ khởi động lại.';products=d.items;el('table').textContent=d.table.name+' · '+d.table.zone;draw()}).catch(function(e){el('table').textContent='QR không hợp lệ: '+e.message});
async function verifyOrder(){if(!lastOrderId)return;try{var d=await api('/api/order-status/'+lastOrderId+'?token='+encodeURIComponent(token));var waiting=d.items.filter(function(i){return i.status==='new'||i.status==='preparing'}).length;var done=d.items.filter(function(i){return i.status==='ready'||i.status==='served'}).length;el('deliveryState').textContent='✓ Máy chủ còn lưu đơn: '+d.items.length+' món, '+waiting+' chờ/chế biến, '+done+' đã xong. '+(d.persistent?'Đơn đã được lưu trên PostgreSQL.':'Bản thử nghiệm có thể mất đơn khi máy chủ khởi động lại.');el('deliveryState').style.color='#167451'}catch(e){el('deliveryState').textContent='⚠ Không thể xác nhận đơn: '+e.message+' Báo nhân viên trước khi gửi lại.';el('deliveryState').style.color='#a83838'}}setInterval(function(){if(lastOrderId&&!document.hidden)verifyOrder()},10000);
el('submit').onclick=async function(){if(sending)return;sending=true;draw();try{var items=products.filter(function(p){return cart[p.id]>0}).map(function(p){return {id:p.id,qty:cart[p.id]}}),a=await api('/api/orders',{method:'POST',body:{token:token,requestId:pending,note:el('note').value,items:items}});el('sent').classList.remove('hidden');lastOrderId=a.id;el('receipt').textContent='Mã đơn #'+a.id.slice(0,8)+' · Máy chủ đã tiếp nhận. Bếp cần đăng nhập và mở tab Đơn Bếp/Bar.';verifyOrder();cart={};pending=crypto.randomUUID();el('note').value='';draw();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){alert(e.message)}finally{sending=false;draw()}};
</script></body></html>
