		throw new Error(num.length + "/" + shift);
	}

		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

		return this.num[index];

		return this.num.length;

		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {

function qrModal(table){let q=url(table),svg=window.SalesQR.svg(q,310);layout('tables',`<div class="card qr-card"><h1>${safe(table)}</h1><p class="small">Mở camera điện thoại và quét để gọi món</p>${svg}<p class="small" style="overflow-wrap:anywhere">${safe(q)}</p><div class="actions" style="justify-content:center"><button class="btn primary" data-print>In QR</button><button class="btn" data-guest="${table}">Mô phỏng khách gọi</button><button class="btn" data-go="tables">← Danh sách bàn</button></div></div>`)}
function kitchenPage(){let os=orders().filter(o=>o.status!=='cancelled'&&o.status!=='served');const c=counts();let totalItems=os.flatMap(o=>o.items).length;
 layout('kitchen',`<div class="statrow"><div class="card"><strong>${c[0]}</strong><small>Đơn đang chờ/làm</small></div><div class="card"><strong>${c[1]}</strong><small>Đã hoàn tất món</small></div><div class="card"><strong>${totalItems}</strong><small>Dòng món trong bếp</small></div><div class="card"><strong>${orders().length}</strong><small>Tổng lượt gọi</small></div></div><div class="actions" style="margin-bottom:17px"><button class="btn ${state.tab==='all'?'primary':''}" data-tab="all">Tất cả</button><button class="btn ${state.tab==='kitchen'?'primary':''}" data-tab="kitchen">🍲 Bếp</button><button class="btn ${state.tab==='bar'?'primary':''}" data-tab="bar">🥤 Quầy bar</button><button class="btn" data-clear>↻ Xóa dữ liệu demo</button></div><div class="ticketlist">${os.map(o=>{let items=o.items.filter(i=>state.tab==='all'||i.station===state.tab);if(!items.length)return '';return `<article class="ticket ${o.status==='ready'?'done':''}"><div class="ticket-head"><div><strong>${safe(o.table)}</strong><div class="small">#${safe(o.id.slice(0,8))} · ${new Date(o.at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}</div></div><span class="pill ${o.status==='ready'?'':'warning'}">${o.status==='new'?'Mới nhận':o.status==='preparing'?'Đang làm':'Chờ phục vụ'}</span></div><div class="ticket-content">${o.note?`<div class="note">📝 ${safe(o.note)}</div>`:''}${items.map(i=>`<div class="item"><div class="two"><b>${i.qty} × ${safe(i.name)}</b><span class="small">${i.station==='bar'?'Bar':'Bếp'}</span></div>${i.note?`<div class="note">${safe(i.note)}</div>`:''}<div class="actions"><span class="pill ${i.status==='ready'?'':'warning'}">${i.status==='new'?'Chờ chế biến':i.status==='preparing'?'Đang làm':'Xong'}</span>${i.status==='new'?`<button class="btn" data-progress="${o.id}:${i.id}:preparing">Bắt đầu</button>`:i.status==='preparing'?`<button class="btn primary" data-progress="${o.id}:${i.id}:ready">✓ Hoàn thành</button>`:''}</div></div>`).join('')}<div class="two" style="padding-top:16px"><b>${money(o.total)}</b><span class="pill ${o.paid?'':'warning'}">${o.paid?'Đã thu tiền':'Chưa thanh toán'}</span></div>${o.status==='ready'?`<div class="actions"><button class="btn primary" data-serve="${o.id}">Đã phục vụ tại bàn</button></div>`:''}</div></article>`}).join('')||'<div class="empty">Chưa có đơn. Mở "QR từng bàn" → "Giả lập khách" để đặt món.</div>'}</div>`)}
function receiptPage(){let os=orders().slice().reverse();layout('receipts',`<div class="ticketlist">${os.map(o=>`<div class="card"><div class="two"><h3>${safe(o.table)}</h3><span class="pill ${o.status==='cancelled'?'warning':''}">${o.status==='cancelled'?'Đã hủy':o.status==='served'?'Đã phục vụ':'Đang chế biến'}</span></div><p class="small">Đơn #${safe(o.id.slice(0,8))} · ${new Date(o.at).toLocaleString('vi-VN')}</p><strong>${money(o.total)}</strong><p class="small">${o.items.map(i=>`${i.qty} ${safe(i.name)}`).join(' · ')}</p><div class="actions">${!o.paid&&o.status!=='cancelled'?`<button class="btn primary" data-pay="${o.id}">Xác nhận đã thu tiền</button>`:'<span class="pill">Đã thanh toán</span>'}${!o.paid&&o.status!=='cancelled'?`<button class="btn danger" data-cancel="${o.id}">Hủy</button>`:''}</div></div>`).join('')||'<div class="empty">Chưa có lượt gọi món</div>'}</div>`)}
function guestView(){let table=state.guestTable;if(!TABLES.includes(table)){return $('#app').innerHTML='<p class="empty">Không tìm thấy bàn.</p>'}let order=orders().find(o=>o.id===state.lastOrder),sum=Object.entries(state.cart).reduce((a,[id,q])=>a+MENU.find(x=>x.id===id).price*q,0),count=Object.values(state.cart).reduce((a,b)=>a+b,0);let markup=`<div class="guest"><div class="guesthead"><div>SALESHUB RESTAURANT · DEMO</div><h1>Chào mừng đến quán!</h1><p>📍 ${safe(table)} · Gọi món không cần đợi nhân viên</p></div>${state.lastOrder&&order?`<div class="card" style="margin-bottom:16px"><div class="two"><strong>Đơn mới gửi #${order.id.slice(0,8)}</strong><span class="pill">${order.status==='new'?'Đã nhận':order.status==='preparing'?'Đang làm':order.status==='ready'?'Chờ phục vụ':order.status==='served'?'Đã phục vụ':'Đã hủy'}</span></div><p class="small">${money(order.total)} · ${order.paid?'Đã thanh toán':'Chưa thanh toán'}</p></div>`:''}<h2>🍽️ Thực đơn hôm nay</h2><div class="foodgrid">${MENU.map(p=>`<div class="card food"><div class="foodicon">${p.emoji}</div><div class="foodmain"><h3>${safe(p.name)}</h3><p class="small" style="margin:3px 0">${p.cat} · ${p.station==='bar'?'Bar':'Bếp'}</p><div class="two"><span class="price">${money(p.price)}</span><div class="step"><button data-dec="${p.id}" ${(state.cart[p.id]||0)===0?'disabled':''}>−</button><b>${state.cart[p.id]||0}</b><button data-inc="${p.id}">＋</button></div></div>${state.cart[p.id]?`<input aria-label="Ghi chú ${safe(p.name)}" class="select" data-note="${p.id}" placeholder="Ghi chú: ít đường..." value="${safe(state.notes[p.id]||'')}" maxlength="180" style="width:100%;margin-top:9px">`:''}</div></div>`).join('')}</div></div><div class="sticky"><div><div class="small">${count} món đã chọn</div><strong>${money(sum)}</strong></div><button class="btn primary" data-place ${!count?'disabled':''}>Gửi món đến bếp →</button></div>`;$('#app').innerHTML=markup}
function place(){const table=state.guestTable,items=Object.entries(state.cart).filter(([,n])=>n).map(([id,qty])=>({...MENU.find(x=>x.id===id),id:crypto.randomUUID(),qty,note:state.notes[id]||'',status:'new'}));if(!items.length)return;const sum=items.reduce((s,i)=>s+i.price*i.qty,0),id=crypto.randomUUID();let all=orders();all.push({id,table,at:stamp(),items,total:sum,status:'new',paid:false,note:''});persist(all);state.cart={};state.notes={};state.lastOrder=id;guestView();notice('Đã gửi đơn tới bếp và quầy bar');}
function mutate(id,handler){let a=orders(),o=a.find(x=>x.id===id);if(!o)return;handler(o);persist(a);route()}
document.addEventListener('click',e=>{const x=e.target.closest('button');if(!x)return;let d=x.dataset;if(d.go){location.hash=d.go;route()}else if(d.qr){state.showQr=d.qr;qrModal(d.qr)}else if(d.guest){state.guestTable=d.guest;state.cart={};state.lastOrder='';location.hash='guest/'+encodeURIComponent(d.guest);route()}else if('print' in d){window.print()}else if(d.tab){state.tab=d.tab;route()}else if(d.inc||d.dec){let id=d.inc||d.dec;state.cart[id]=Math.max(0,Math.min(20,(state.cart[id]||0)+(d.inc?1:-1)));if(!state.cart[id])delete state.cart[id];guestView()}else if('place' in d){place()}else if(d.progress){let [oid,iid,st]=d.progress.split(':');mutate(oid,o=>{let item=o.items.find(i=>i.id===iid);if(!item||o.status==='served'||o.status==='cancelled')return;if((item.status==='new'&&st==='preparing')||(item.status==='preparing'&&st==='ready'))item.status=st;o.status=o.items.every(i=>i.status==='ready')?'ready':o.items.some(i=>i.status!=='new')?'preparing':'new'})}else if(d.serve){mutate(d.serve,o=>{if(o.status==='ready')o.status='served'})}else if(d.pay){mutate(d.pay,o=>{if(o.status!=='cancelled')o.paid=true})}else if(d.cancel){mutate(d.cancel,o=>{if(!o.paid)o.status='cancelled'})}else if('clear' in d){if(confirm('Xóa toàn bộ dữ liệu mô phỏng?')){persist([]);route()}}});
document.addEventListener('input',e=>{if(e.target.dataset.note)state.notes[e.target.dataset.note]=e.target.value});
window.addEventListener('hashchange',route);window.addEventListener('storage',e=>{if(e.key===KEY)route()});let channel;try{channel=new BroadcastChannel('saleshub_demo_qr');channel.onmessage=()=>route()}catch{}setInterval(()=>{if(!document.hidden)route()},9000);route();
})();
</script></body></html>
